
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Orchestrix | Task Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <div class="container header-content">
            <div>
                <h1>Orchestrix</h1>
                <p>Manage your tasks efficiently</p>
            </div>
        </div>
    </header>


    <main class="container">

        <!-- MESSAGE AREA -->
        <div id="message" class="message hidden"></div>


        <!-- TASK FORM -->
        <section class="card">

            <div class="section-heading">
                <h2 id="form-heading">Create New Task</h2>
            </div>

            <form id="task-form">

                <div class="form-group">
                    <label for="title">Task Title</label>

                    <input
                        type="text"
                        id="title"
                        name="title"
                        placeholder="Enter task title"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="description">Description</label>

                    <textarea
                        id="description"
                        name="description"
                        placeholder="Enter task description"
                        rows="3"
                        required
                    ></textarea>
                </div>


                <div class="form-row">

                    <div class="form-group">
                        <label for="priority">Priority</label>

                        <select id="priority" name="priority" required>
                            <option value="">Select Priority</option>
                            <option value="Low">Low</option>
                            <option value="Medium">Medium</option>
                            <option value="High">High</option>
                        </select>
                    </div>


                    <div class="form-group">
                        <label for="dueDate">Due Date</label>

                        <input
                            type="date"
                            id="dueDate"
                            name="dueDate"
                            required
                        >
                    </div>

                </div>


                <div class="form-actions">

                    <button type="submit" id="submit-button">
                        Create Task
                    </button>

                    <button
                        type="button"
                        id="cancel-edit"
                        class="secondary-button hidden"
                    >
                        Cancel
                    </button>

                </div>

            </form>

        </section>


        <!-- TASK LIST -->
        <section class="card task-section">

            <div class="task-header">

                <div>
                    <h2>Your Tasks</h2>
                    <p>View and manage all your tasks</p>
                </div>


                <div class="filter-group">

                    <label for="status-filter">Filter by status</label>

                    <select id="status-filter">
                        <option value="">All Tasks</option>
                        <option value="Pending">Pending</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Completed">Completed</option>
                    </select>

                </div>

            </div>


            <div id="loading" class="loading hidden">
                Loading tasks...
            </div>


            <div class="table-wrapper">

                <table>

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Task</th>
                            <th>Priority</th>
                            <th>Due Date</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="task-list">
                    </tbody>

                </table>

            </div>


            <div id="empty-state" class="empty-state hidden">
                <h3>No tasks found</h3>
                <p>Create a new task to get started.</p>
            </div>

        </section>

    </main>


    <footer class="footer">
        <p>Orchestrix Task Management Application</p>
    </footer>


    <script src="app.js"></script>

</body>
</html>
